spring.application.name=staffhub-backend

# ============================================================
# SQL SERVER DATABASE
# ============================================================

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StaffHub;integratedSecurity=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SERVER
# ============================================================

server.port=8080

# ============================================================
# SESSION
# ============================================================

server.servlet.session.timeout=30m

# Cookie is HTTP-only so JavaScript cannot directly read JSESSIONID.
server.servlet.session.cookie.http-only=true

# Required when Vercel frontend talks to the backend on
# a different site through Cloudflare Tunnel.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# For local HTTP development this stays false.
# When using HTTPS Cloudflare Tunnel, set:
# SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ============================================================
# FRONTEND
# ============================================================

FRONTEND_URL=${FRONTEND_URL:http://localhost:5173}